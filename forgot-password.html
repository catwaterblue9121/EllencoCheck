<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <script src="./ellenco-theme.js"></script>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Recuperar senha - EllencoCheck</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./supabase-config.js"></script>
    <link rel="stylesheet" href="./ellenco-theme.css">
</head>

<body class="min-h-screen bg-slate-100 flex items-center justify-center p-4 sm:p-6">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden">
        <div class="h-2 w-full bg-[#EE3237]"></div>
        <div class="p-6 sm:p-8">
            <h1 class="text-3xl font-extrabold italic tracking-tight text-[#113A6E] text-center">
                Ellenco<span class="text-[#EE3237]">Check</span>
            </h1>
            <h2 class="text-xl font-bold text-[#113A6E] mt-6 mb-1">Recuperar senha</h2>
            <p class="text-sm text-slate-500 mb-6">Informe o e-mail da sua conta.</p>

            <form id="form">
                <input id="email" type="email" required class="w-full border rounded-lg px-4 py-3 mb-4" placeholder="seu@email.com">
                <button id="btn" class="w-full bg-[#113A6E] hover:bg-[#0d2e58] text-white rounded-lg py-3 font-bold disabled:opacity-60">
                    Enviar instruções
                </button>
            </form>

            <p id="msg" class="mt-4 text-sm"></p>
            <a href="./login.html" class="block mt-6 text-center text-[#113A6E] font-bold hover:underline">Voltar para o login</a>
        </div>
    </div>

    <script>
        const sb = window.ellencoSupabase;
        document.getElementById("form").addEventListener("submit", async e => {
            e.preventDefault();
            const msg = document.getElementById("msg");
            const btn = document.getElementById("btn");
            btn.disabled = true;
            try {
                const email = document.getElementById("email").value.trim().toLowerCase();
                const { error } = await sb.auth.resetPasswordForEmail(email, {
                    redirectTo: new URL("./reset-password.html", location.href).href
                });
                if (error) throw error;
                msg.textContent = "Se o e-mail estiver cadastrado, você receberá as instruções para redefinir a senha.";
                msg.className = "mt-4 text-sm text-emerald-600";
            } catch (err) {
                msg.textContent = err.message || "Não foi possível enviar as instruções.";
                msg.className = "mt-4 text-sm text-red-600";
            } finally {
                btn.disabled = false;
            }
        });
    </script>
</body>

</html>
