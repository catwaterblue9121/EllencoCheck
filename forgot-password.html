<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recuperar senha - EllencoCheck</title><script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase-config.js"></script></head>
<body class="min-h-screen bg-slate-100 flex items-center justify-center p-6">
<div class="bg-white rounded-2xl shadow p-8 w-full max-w-md">
<h1 class="text-2xl font-bold text-[#113A6E] mb-2">Recuperar senha</h1>
<p class="text-sm text-slate-500 mb-6">Informe o e-mail da sua conta.</p>
<form id="form"><input id="email" type="email" required class="w-full border rounded-lg px-4 py-3 mb-4" placeholder="seu@email.com">
<button class="w-full bg-[#113A6E] text-white rounded-lg py-3 font-bold">Enviar instruções</button></form>
<p id="msg" class="mt-4 text-sm"></p><a href="./loginecadastro.html" class="block mt-6 text-center text-[#113A6E] font-bold">Voltar para o login</a>
</div>
<script>
const sb=window.ellencoSupabase;
document.getElementById("form").addEventListener("submit",async e=>{
 e.preventDefault(); const msg=document.getElementById("msg");
 try{
   const email=document.getElementById("email").value.trim().toLowerCase();
   const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:new URL("./reset-password.html",location.href).href});
   if(error) throw error;
   msg.textContent="Se o e-mail estiver cadastrado, você receberá as instruções para redefinir a senha.";
   msg.className="mt-4 text-sm text-emerald-600";
 }catch(err){msg.textContent=err.message||"Não foi possível enviar as instruções.";msg.className="mt-4 text-sm text-red-600";}
});
</script></body></html>
