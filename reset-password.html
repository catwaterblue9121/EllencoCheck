<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nova senha - EllencoCheck</title><script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase-config.js"></script></head>
<body class="min-h-screen bg-slate-100 flex items-center justify-center p-6">
<div class="bg-white rounded-2xl shadow p-8 w-full max-w-md">
<h1 class="text-2xl font-bold text-[#113A6E] mb-6">Criar nova senha</h1>
<form id="form"><input id="senha" type="password" minlength="6" required class="w-full border rounded-lg px-4 py-3 mb-4" placeholder="Nova senha">
<input id="confirmar" type="password" minlength="6" required class="w-full border rounded-lg px-4 py-3 mb-4" placeholder="Confirme a senha">
<button class="w-full bg-[#113A6E] text-white rounded-lg py-3 font-bold">Redefinir senha</button></form>
<p id="msg" class="mt-4 text-sm"></p>
</div>
<script>
const sb=window.ellencoSupabase;
const msg=document.getElementById("msg");
let recoveryReady=false;
sb.auth.onAuthStateChange((event,session)=>{
    if(event==="PASSWORD_RECOVERY" || session) recoveryReady=true;
});
document.getElementById("form").addEventListener("submit",async e=>{
 e.preventDefault();
 if(!recoveryReady){msg.textContent="Abra o link de recuperação recebido por e-mail e tente novamente.";msg.className="mt-4 text-sm text-red-600";return;}
 if(senha.value!==confirmar.value){msg.textContent="As senhas não coincidem.";msg.className="mt-4 text-sm text-red-600";return;}
 try{
   const {error}=await sb.auth.updateUser({password:senha.value});
   if(error) throw error;
   msg.textContent="Senha alterada com sucesso!";
   msg.className="mt-4 text-sm text-emerald-600";
   await sb.auth.signOut();
   setTimeout(()=>location.href="./login.html",1200);
 }catch(err){msg.textContent=err.message||"Não foi possível alterar a senha.";msg.className="mt-4 text-sm text-red-600";}
});
</script></body></html>
