<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <script src="./ellenco-theme.js"></script>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Nova senha - EllencoCheck</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./supabase-config.js"></script>
    <link rel="stylesheet" href="./ellenco-theme.css">
</head>

<body class="min-h-screen bg-slate-100 flex items-center justify-center p-4 sm:p-6">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden">
        <div class="h-2 w-full bg-[#EE3237]"></div>
        <div class="p-6 sm:p-8">
            <h1 class="text-3xl font-extrabold italic tracking-tight text-[#113A6E] text-center">
                Ellenco<span class="text-[#EE3237]">Check</span>
            </h1>
            <h2 class="text-xl font-bold text-[#113A6E] mt-6 mb-6">Criar nova senha</h2>

            <form id="form">
                <input id="senha" type="password" minlength="6" required autocomplete="new-password"
                    class="w-full border rounded-lg px-4 py-3 mb-4" placeholder="Nova senha (mín. 6 caracteres)">
                <input id="confirmar" type="password" minlength="6" required autocomplete="new-password"
                    class="w-full border rounded-lg px-4 py-3 mb-4" placeholder="Confirme a senha">
                <button id="btn" class="w-full bg-[#113A6E] hover:bg-[#0d2e58] text-white rounded-lg py-3 font-bold disabled:opacity-60">
                    Redefinir senha
                </button>
            </form>

            <p id="msg" class="mt-4 text-sm"></p>
            <a href="./login.html" class="block mt-6 text-center text-[#113A6E] font-bold hover:underline">Voltar para o login</a>
        </div>
    </div>

    <script>
        const sb = window.ellencoSupabase;
        const msg = document.getElementById("msg");
        const senhaEl = document.getElementById("senha");
        const confirmarEl = document.getElementById("confirmar");
        const btn = document.getElementById("btn");
        let recoveryReady = false;

        function mostrar(texto, erro) {
            msg.textContent = texto;
            msg.className = "mt-4 text-sm " + (erro ? "text-red-600" : "text-emerald-600");
        }

        // O link do e-mail traz erro no endereço quando está vencido ou já foi usado
        const params = new URLSearchParams(location.hash.replace(/^#/, "") || location.search);
        if (params.get("error_description")) {
            mostrar("Link inválido ou expirado. Solicite uma nova recuperação de senha.", true);
        }

        sb.auth.onAuthStateChange((event, session) => {
            if (event === "PASSWORD_RECOVERY" || (session && event === "SIGNED_IN")) recoveryReady = true;
        });

        // O evento pode ter disparado antes do listener acima: confere a sessão também
        sb.auth.getSession().then(({ data }) => {
            if (data && data.session) recoveryReady = true;
        });

        document.getElementById("form").addEventListener("submit", async e => {
            e.preventDefault();

            if (!recoveryReady) {
                return mostrar("Abra o link de recuperação recebido por e-mail e tente novamente.", true);
            }
            if (senhaEl.value !== confirmarEl.value) {
                return mostrar("As senhas não coincidem.", true);
            }

            btn.disabled = true;
            try {
                const { error } = await sb.auth.updateUser({ password: senhaEl.value });
                if (error) throw error;

                mostrar("Senha alterada com sucesso! Redirecionando para o login...", false);
                await sb.auth.signOut();
                localStorage.removeItem("usuario");
                setTimeout(() => { location.href = "./login.html"; }, 1500);
            } catch (err) {
                mostrar(err.message || "Não foi possível alterar a senha.", true);
                btn.disabled = false;
            }
        });
    </script>
</body>

</html>
