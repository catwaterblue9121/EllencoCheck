<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Usuários - EllencoCheck</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase-config.js"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">
<header class="bg-[#113A6E] text-white px-6 py-4 flex items-center justify-between">
  <div>
    <h1 class="text-2xl font-bold">Usuários</h1>
    <p class="text-sm opacity-80">Gerenciamento de usuários do EllencoCheck</p>
  </div>
  <a href="./index.html" class="bg-white/10 hover:bg-white/20 px-4 py-2 rounded-lg">Voltar</a>
</header>

<main class="max-w-6xl mx-auto p-6">
  <section class="bg-white rounded-2xl shadow-sm p-6 mb-6">
    <h2 class="font-bold text-lg mb-4">Cadastrar usuário</h2>
    <form id="formUsuario" class="grid md:grid-cols-4 gap-4">
      <input id="nome" required placeholder="Nome completo" class="border rounded-lg px-4 py-3">
      <input id="email" required type="email" placeholder="E-mail" class="border rounded-lg px-4 py-3">
      <input id="senha" required minlength="6" type="password" placeholder="Senha (mín. 6)" class="border rounded-lg px-4 py-3">
      <button class="bg-[#113A6E] text-white rounded-lg font-bold px-4 py-3 hover:opacity-90">Cadastrar</button>
    </form>
    <p id="mensagem" class="mt-4 text-sm hidden"></p>
  </section>

  <section class="bg-white rounded-2xl shadow-sm overflow-hidden">
    <div class="p-6 border-b flex items-center justify-between">
      <h2 class="font-bold text-lg">Usuários cadastrados</h2>
      <button onclick="carregarUsuarios()" class="border rounded-lg px-4 py-2 hover:bg-slate-50">Atualizar</button>
    </div>
    <div class="overflow-x-auto">
      <table class="w-full text-sm">
        <thead class="bg-slate-50">
          <tr>
            <th class="text-left px-6 py-4">ID</th>
            <th class="text-left px-6 py-4">Nome</th>
            <th class="text-left px-6 py-4">E-mail</th>
            <th class="text-left px-6 py-4">Status</th>
            <th class="text-right px-6 py-4">Ações</th>
          </tr>
        </thead>
        <tbody id="lista"></tbody>
      </table>
    </div>
  </section>
</main>

<script>
const sb=window.ellencoSupabase;
function mostrar(msg, erro=false){
 const el=document.getElementById("mensagem");
 el.textContent=msg; el.className="mt-4 text-sm "+(erro?"text-red-600":"text-emerald-600");
}
async function exigirAdmin(){
 const {data:{user}}=await sb.auth.getUser();
 if(!user){location.href="./login.html";return null;}
 const {data:p,error}=await sb.from("profiles").select("id,nome,email,ativo,role").eq("id",user.id).single();
 if(error||!p||!p.ativo){await sb.auth.signOut();location.href="./login.html";return null;}
 if(p.role!=="admin"){alert("Acesso restrito a administradores.");location.href="./index.html";return null;}
 return p;
}
async function carregarUsuarios(){
 const me=await exigirAdmin(); if(!me)return;
 const {data:usuarios,error}=await sb.from("profiles").select("id,nome,email,ativo,role,criado_em").order("criado_em");
 if(error)return mostrar(error.message,true);
 const lista=document.getElementById("lista"); lista.innerHTML="";
 (usuarios||[]).forEach(u=>{
   const tr=document.createElement("tr"); tr.className="border-t";
   tr.innerHTML=`<td class="px-6 py-4">${escapeHtml(u.id)}</td>
   <td class="px-6 py-4 font-medium">${escapeHtml(u.nome)}</td>
   <td class="px-6 py-4">${escapeHtml(u.email)}</td>
   <td class="px-6 py-4">${u.role==="admin"?"Administrador":"Usuário"}</td>
   <td class="px-6 py-4">${u.ativo?"Ativo":"Inativo"}</td>
   <td class="px-6 py-4 text-right">
   <button onclick="editar('${u.id}',${JSON.stringify(u.nome)},${JSON.stringify(u.email)},${u.ativo})" class="text-[#113A6E] font-bold mr-3">Editar</button>
   ${u.id!==me.id?`<button onclick="excluir('${u.id}')" class="text-red-600 font-bold">Desativar</button>`:""}
   </td>`;
   lista.appendChild(tr);
 });
}
async function cadastrar(e){
 e.preventDefault();
 const nome=document.getElementById("nome").value.trim(), email=document.getElementById("email").value.trim().toLowerCase(), senha=document.getElementById("senha").value;
 if(senha.length<6)return mostrar("A senha deve ter pelo menos 6 caracteres.",true);
 const {data,error}=await sb.auth.signUp({email,password:senha,options:{data:{nome},emailRedirectTo:location.href}});
 if(error)return mostrar(error.message,true);
 mostrar(data.session?"Usuário cadastrado com sucesso!":"Usuário criado. Se a confirmação de e-mail estiver ativa, ele precisará confirmar o endereço.");
 e.target.reset(); setTimeout(carregarUsuarios,500);
}
async function editar(id,nomeAtual,emailAtual,ativoAtual){
 const nome=prompt("Nome:",nomeAtual); if(nome===null)return;
 const {error}=await sb.from("profiles").update({nome:nome.trim(),ativo:ativoAtual}).eq("id",id);
 if(error)return alert(error.message);
 carregarUsuarios();
}
async function excluir(id){
 if(!confirm("Desativar este usuário?"))return;
 const {error}=await sb.from("profiles").update({ativo:false}).eq("id",id);
 if(error)return alert(error.message);
 carregarUsuarios();
}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
document.getElementById("formUsuario").addEventListener("submit",cadastrar);
carregarUsuarios();
</script>
</body>
</html>
